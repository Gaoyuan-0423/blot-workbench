name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify WispLab release and rollback tooling
        run: python3 -m unittest discover -s deployment/wisplab -p 'test_*.py' -q
      - run: npm ci
      - run: node --test scripts/*.check.mjs
      - run: npm run check
      - run: node scripts/third-party-notices.mjs --output dist/THIRD_PARTY_NOTICES.txt
      - name: Preserve the tested production build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  browser:
    name: ${{ matrix.os }} / ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        channel: [chrome, msedge]
    env:
      CI: true
      BROWSER_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the actual stable browser
        run: npx playwright install ${{ matrix.channel }}
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:vision:e2e
      - name: Preserve browser reports, failure screenshots, and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}-${{ matrix.channel }}
          path: |
            playwright-report/
            test-results/
            playwright-report-vision/
            test-results-vision/
          if-no-files-found: ignore
          retention-days: 14
