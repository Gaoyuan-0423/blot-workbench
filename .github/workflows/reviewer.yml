name: BlotLens reviewer
on:
  pull_request:
    paths: ["reviewer", ".gitmodules", "reviewer/**", "package*.json", ".github/workflows/reviewer.yml"]
  push:
    branches: [main]
    paths: ["reviewer", ".gitmodules", "reviewer/**", "package*.json", ".github/workflows/reviewer.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run reviewer:test
      - run: npm run reviewer:build
      - run: npm run reviewer:evaluate
      - run: npx playwright install --with-deps chromium
      - run: npm run reviewer:e2e
