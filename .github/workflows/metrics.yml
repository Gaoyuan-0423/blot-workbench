name: Repository metrics snapshot

on:
  schedule:
    # Monday 08:17 Asia/Shanghai. GitHub scheduled execution can be delayed.
    - cron: '17 0 * * 1'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read public GitHub counts; do not collect application analytics
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/collect-metrics.mjs --repo "$GITHUB_REPOSITORY" --output-dir .release/metrics
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-snapshot
          path: .release/metrics/*.json
          if-no-files-found: error
          retention-days: 90

  preserve:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write permission exists only here; collection code runs with read permission.
    # GitHub contents:write is repository-wide. These commands target only metrics;
    # protect main independently if a hard branch-level restriction is required.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: history
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: metrics-snapshot
          path: metrics-snapshot
      - name: Append snapshots on the dedicated metrics branch
        working-directory: history
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin metrics > /dev/null; then
            git fetch origin metrics --depth=1
            git switch --force-create metrics FETCH_HEAD
          else
            remote_status=$?
            if [ "$remote_status" -ne 2 ]; then exit "$remote_status"; fi
            git switch --orphan metrics
          fi
          mkdir -p snapshots
          cp ../metrics-snapshot/*.json snapshots/
          git add -- snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "metrics: snapshot ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:refs/heads/metrics
